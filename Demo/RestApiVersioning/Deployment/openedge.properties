# For releases that register web handlers in conf/openedge.properties (e.g. OpenEdge 12.2).
# Releases with WEB-INF/adapters/web/ROOT/ROOT.handlers (e.g. OpenEdge 12.8) use ROOT.handlers.
# oepas1 is the default ABL application name - use the section of your ABL application and
# number the entries after its existing handlerN entries. The first matching URI wins.
[oepas1.ROOT.WEB]
    handler1=Demo.RestApiVersioning.Simple.SimpleOrderHandler: /simple/Orders/{Ordernum}
    handler2=Demo.RestApiVersioning.Simple.SimpleOrderMediaTypeHandler: /simple/media/Orders/{Ordernum}
    handler3=Demo.RestApiVersioning.Simple.SimpleOrderPathParameterHandler: /simple/{Version}/Orders/{Ordernum}
    handler4=Demo.RestApiVersioning.UriFixed.OrdersV0Handler: /v0/Orders/{Ordernum}
    handler5=Demo.RestApiVersioning.UriFixed.OrdersV0Handler: /v0/Orders
    handler6=Demo.RestApiVersioning.UriFixed.OrdersV1Handler: /v1/Orders/{Ordernum}
    handler7=Demo.RestApiVersioning.UriFixed.OrdersV1Handler: /v1/Orders
    handler8=Demo.RestApiVersioning.UriFixed.OrdersV2Handler: /v2/Orders/{Ordernum}
    handler9=Demo.RestApiVersioning.UriFixed.OrdersV2Handler: /v2/Orders
    handler10=Demo.RestApiVersioning.UriVersion.OrdersHandler: /api/{Version}/Orders/{Ordernum}
    handler11=Demo.RestApiVersioning.UriVersion.OrdersHandler: /api/{Version}/Orders
    handler12=Demo.RestApiVersioning.MediaType.OrdersHandler: /Orders/{Ordernum}
    handler13=Demo.RestApiVersioning.MediaType.OrdersHandler: /Orders
    handler14=Demo.RestApiVersioning.Web.OpenApiDocumentHandler: /openapi/{Document}
    handler15=Demo.RestApiVersioning.Web.OpenApiDocumentHandler: /openapi

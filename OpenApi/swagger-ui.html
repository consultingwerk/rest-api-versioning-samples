<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sports2000 Orders API - Versions</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        // @BASE@ is replaced by the OpenApiDocumentHandler, e.g. /web/openapi
        window.ui = SwaggerUIBundle({
            urls: [
                { url: "@BASE@/orders-mediatype.openapi.json", name: "Media type versioning (one URI)" },
                { url: "@BASE@/orders-v2.openapi.json",        name: "URI versioning - v2 (current)" },
                { url: "@BASE@/orders-v1.openapi.json",        name: "URI versioning - v1 (deprecated)" }
            ],
            "urls.primaryName": "Media type versioning (one URI)",
            queryConfigEnabled: true,
            dom_id: "#swagger-ui",
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: "StandaloneLayout"
        });
    </script>
</body>
</html>
